name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: spendguard
          POSTGRES_PASSWORD: spendguard
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spendguard -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      elasticmq:
        image: softwaremill/elasticmq-native:1.6.14
        ports:
          - 9324:9324
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict
      - name: Wait for ElasticMQ
        run: timeout 60 bash -c 'until curl -s -o /dev/null http://localhost:9324; do sleep 1; done'
      - run: uv run pytest
      - run: uv build --wheel
      - run: docker build -t spendguard:ci .

  template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.7
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: uv sync --frozen
      - run: make validate-template
