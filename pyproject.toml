[project]
name = "spendguard"
version = "0.1.0"
description = "Reviews expense claims and supplier invoices for the fictional Halden Group against a written policy, with a human approver in the loop."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.44.3",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-aws>=1.9.3",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langfuse>=5.2.0,<6",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spendguard"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "PL", "TID"]
ignore = ["PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src", "tests"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["cfnlint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-p safeguards -p pytester --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "boto3-stubs[sqs,ssm]>=1.44.3",
    "cfn-lint>=1.60.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]
