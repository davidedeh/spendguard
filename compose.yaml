name: spendguard

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: spendguard
      POSTGRES_PASSWORD: spendguard
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendguard -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.14
    ports:
      - "9324:9324"
      - "9325:9325"

volumes:
  postgres-data:
